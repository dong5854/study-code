apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: logging-deployment
  name: logging-deployment
  namespace: logging-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-deployment
  template:
    metadata:
      labels:
        app: logging-deployment
    spec:
      containers:
      - name: app-container
        image: busybox
        command: ['sh', '-c', "while true; do echo 'Log entry' >> /var/log/app/app.log; sleep 5; done"]
        volumeMounts:      
          - name: app-log
            mountPath: /var/log/app
      initContainers:
        - name: log-agent
          image: busybox
          restartPolicy: Always
          command: ['tail', '-f', '/var/log/app/app.log']
          volumeMounts:
            - name: app-log
              mountPath: /var/log/app
      volumes:
        - name: app-log
          emptyDir: {}
